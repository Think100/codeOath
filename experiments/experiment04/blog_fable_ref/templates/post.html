{% extends "base.html" %}

{% block title %}{{ post.title }} – My Blog{% endblock %}

{% block content %}
<article>
    <h1>{{ post.title }}</h1>
    <div class="post-meta">
        <time datetime="{{ post.date.isoformat() }}">{{ post.date.strftime('%B %d, %Y') }}</time>
        {% for tag in post.tags %}
        <span class="tag">{{ tag }}</span>
        {% endfor %}
    </div>
    <div class="post-body">
        {{ post.html | safe }}
    </div>
</article>
<p><a href="{{ url_for('index') }}">&larr; Back to all posts</a></p>
{% endblock %}

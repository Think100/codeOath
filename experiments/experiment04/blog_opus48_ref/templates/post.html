{% extends "base.html" %}

{% block title %}{{ post.title }} - My Blog{% endblock %}

{% block content %}
    <article class="post">
        <header class="post-header">
            <h1>{{ post.title }}</h1>
            <time class="post-date" datetime="{{ post.date_iso }}">{{ post.date_display }}</time>
            {% if post.tags %}
                <div class="tags">
                    {% for tag in post.tags %}
                        <span class="tag">{{ tag }}</span>
                    {% endfor %}
                </div>
            {% endif %}
        </header>
        <div class="post-body">
            {{ post.html | safe }}
        </div>
    </article>
    <p class="back-link"><a href="{{ url_for('index') }}">&larr; Back to all posts</a></p>
{% endblock %}
